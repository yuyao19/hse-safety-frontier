name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "vendor/**"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Test game
        run: npm run test:logic && npm run test:playthrough

      - name: Build offline web assets
        run: npm run build
        env:
          CAPACITOR_BUILD: "true"

      - name: Sync Android project
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HSE-Safety-Frontier-v1.0.1-android-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Safety-Frontier-Android-APK
          path: HSE-Safety-Frontier-v1.0.1-android-test.apk
          if-no-files-found: error
