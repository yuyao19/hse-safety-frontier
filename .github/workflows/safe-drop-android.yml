name: Build Safe Drop Android APK

on:
  workflow_dispatch:
  push:
    branches: [safe-drop-apk]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: safe-drop-android/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: safe-drop-android
        run: npm ci

      - name: Test game
        working-directory: safe-drop-android
        run: npm test

      - name: Create Android project
        working-directory: safe-drop-android
        run: npx cap add android

      - name: Build installable debug APK
        working-directory: safe-drop-android/android
        run: ./gradlew assembleDebug

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs safe-drop-android/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Name APK
        run: cp safe-drop-android/android/app/build/outputs/apk/debug/app-debug.apk Safe-Drop-FORUS-v1.0.0-android-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Safe-Drop-FORUS-Android-APK
          path: Safe-Drop-FORUS-v1.0.0-android-test.apk
          if-no-files-found: error
